# schema.yml — the single source of truth for the FULL structure of
# bumfuzzle-template.yml and .bumfuzzle/config.yml: every top-level section,
# every node shape, every property on every node, which are required, and
# how nesting works.
#
# Written in JSON Schema (2020-12) vocabulary, YAML-encoded to match this
# project's convention. $defs are read directly (via yq/JS path queries) by
# scripts/rule-runner.sh, scripts/prerequisites/validate-schema.sh, and
# index.html instead of any of them hardcoding these lists/shapes
# themselves — see skills/bumfuzzle/SKILL.md.

"$schema": "https://json-schema.org/draft/2020-12/schema"
"$id": "bumfuzzle-config"
title: "Bumfuzzle config"
description: "Shared by bumfuzzle-template.yml (the full catalog: scripts + rules + enums) and a project's .bumfuzzle/config.yml (any subset of the same three sections)."
schema_version: 2
type: object
additionalProperties: false
required: [schema_version]
properties:
  schema_version:
    type: integer
    minimum: 1
    description: "Format revision this config was written against; must equal this file's own schema_version above (checked by scripts/prerequisites/validate-schema.sh, since JSON Schema alone can't compare a document's value against its schema's)."
  scripts:
    type: array
    items: { "$ref": "#/$defs/scriptNode" }
  rules:
    type: array
    items: { "$ref": "#/$defs/ruleNode" }
  enums:
    type: array
    items: { "$ref": "#/$defs/enumNode" }

"$defs":

  # ── scripts: reusable check definitions ──────────────────────────────────

  scriptNode:
    oneOf:
      - "$ref": "#/$defs/scriptGroup"
      - "$ref": "#/$defs/scriptEntry"

  scriptGroup:
    type: object
    additionalProperties: false
    required: [group, scripts]
    properties:
      group: { type: string }
      scripts:
        type: array
        items: { "$ref": "#/$defs/scriptNode" }

  scriptEntry:
    type: object
    additionalProperties: false
    required: [id, name, command]
    properties:
      id: { type: string, description: "kebab-case, unique, locked after first save" }
      name: { type: string }
      description: { type: string }
      command: { type: string, description: "shell script; reads args as env vars" }
      mutative: { type: boolean, description: "true if command edits/writes files instead of only checking them; omitted means false. Lives here, not on any rule referencing this script - every script_reusable rule instantiating this script shares this one flag." }
      args:
        type: array
        items: { "$ref": "#/$defs/arg" }

  # ── args: on a script — always fully inline, one shape only

  arg:
    type: object
    additionalProperties: false
    required: [key, label, type]
    properties:
      key: { type: string, pattern: "^[A-Z][A-Z0-9_]*$", description: "env var name; always unambiguous and self-explanatory on its own, never a bare generic word" }
      label: { type: string }
      description: { type: string }
      type: { "$ref": "#/$defs/argType" }
      required: { type: boolean, description: "omitted means false, same as list and every other optional boolean flag on this node", default: false }
      placeholder: { type: string, description: "not applicable when type: bool" }
      default: { description: "type-matched literal" }
      min: { type: number, description: "type: int or double only" }
      max: { type: number, description: "type: int or double only" }
      list: { type: boolean, description: "not type: bool. true = the script reads this arg as a YAML list of values (newline-joined into the env var, one per line) instead of a single scalar; the wizard renders an add/remove list editor instead of a single input. A rule instantiating a list: true arg may also supply { enum_ref: <id> } in place of a literal list — see ruleEntryReusable.args below." }
      enum_ref: { type: string, minLength: 1, description: "id of an entry in enums: whose own declared type must equal this arg's type. Optional on any type; when set, this arg's value(s) are restricted to that one enum's members (checked by scripts/prerequisites/reference-integrity.sh and script_arg_types_validate.py, not expressible in plain JSON Schema since it's cross-referential). When absent, any value matching this arg's own type is accepted, with type-compatible enums offered only as picker suggestions, never a hard restriction." }
      visible_when: { "$ref": "#/$defs/visibleWhen" }

  argType:
    type: string
    enum: [string, int, double, regex, path-file, path-folder, bool, glob]

  visibleWhen:
    type: object
    additionalProperties: false
    required: [key, eq]
    properties:
      key: { type: string, description: "a sibling arg's key" }
      eq: { type: string }

  # ── enums: reusable value lists ────────────────────────────────────────────

  enumNode:
    oneOf:
      - "$ref": "#/$defs/enumGroup"
      - "$ref": "#/$defs/enumEntry"

  enumGroup:
    type: object
    additionalProperties: false
    required: [group, enums]
    properties:
      group: { type: string }
      enums:
        type: array
        items: { "$ref": "#/$defs/enumNode" }

  enumEntry:
    type: object
    additionalProperties: false
    required: [id, name, description, type, values]
    properties:
      id: { type: string, description: "kebab-case, referenced from args via enum_ref" }
      name: { type: string }
      description: { type: string }
      type: { "$ref": "#/$defs/argType", description: "the literal kind of value this enum holds; lets the wizard offer it as a pick-source for any arg whose own type matches, independent of enum_ref" }
      values:
        type: array
        items: { "$ref": "#/$defs/enumValue" }

  enumValue:
    type: object
    additionalProperties: false
    required: [name, value]
    properties:
      name: { type: string, description: "shown in the wizard" }
      value: { type: string, description: "literal written into the target config file" }
      description: { type: string }

  # ── rules: instances of a script, or standalone commands ─────────────────

  ruleNode:
    description: "A rules[] entry is a group, OR a script_clean rule (own inline command), OR a script_reusable rule (instantiates a scripts: entry with concrete arg values) — never a fourth shape."
    oneOf:
      - "$ref": "#/$defs/ruleGroup"
      - "$ref": "#/$defs/ruleEntryClean"
      - "$ref": "#/$defs/ruleEntryReusable"

  ruleGroup:
    type: object
    additionalProperties: false
    required: [group, rules]
    properties:
      group: { type: string }
      rules:
        type: array
        items: { "$ref": "#/$defs/ruleNode" }

  ruleEntryClean:
    type: object
    additionalProperties: false
    required: [type, name, command]
    properties:
      type: { const: script_clean }
      name: { type: string }
      description: { type: string }
      command: { type: string, description: "inline shell command, not shared with any script" }
      severity: { "$ref": "#/$defs/severity" }
      instruction: { type: string }
      enabled: { type: boolean }
      requires: { type: string, description: "binary that must be installed for this rule to run" }
      on_missing: { "$ref": "#/$defs/onMissing" }
      mutative: { type: boolean, description: "true if command edits/writes files instead of only checking them; omitted means false, same as every other optional boolean flag on this node" }

  ruleEntryReusable:
    type: object
    additionalProperties: false
    required: [type, name, script]
    properties:
      type: { const: script_reusable }
      name: { type: string }
      description: { type: string }
      script: { type: string, description: "id of the scripts: entry being instantiated" }
      args:
        type: object
        description: "map of KEY: value — KEY must match one of the script's declared arg keys. value is a literal matching the arg's type (its full set, one pick or several, when the arg's own enum_ref pins it to one enum), or, only when the arg is list: true, { enum_ref: <id> } in place of a literal list — a live reference resolved at check time against every current value of that enums: entry, never copied into this file. If the arg's own definition already pins an enum_ref, this must reference that exact same enum; otherwise it may reference any enums: entry whose own declared type matches the arg's type."
      severity: { "$ref": "#/$defs/severity" }
      instruction: { type: string }
      enabled: { type: boolean }
      requires: { type: string }
      on_missing: { "$ref": "#/$defs/onMissing" }

  ruleType:
    type: string
    enum: [script_clean, script_reusable]

  severity:
    type: string
    enum: [warn, error, hard-stop]
    default: error

  onMissing:
    type: string
    enum: [skip, warn, fail]
    default: warn
